[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugas"
version = "0.1.0"
description = "Uncertainty-gated action shielding for offline-to-online microgrid control implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7"]

[project.scripts]
ugas = "ugas.cli:main"

[tool.setuptools.packages.find]
include = ["ugas*"]
